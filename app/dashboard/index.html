<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081c22">
  <meta name="description" content="WellPulse Atlas – groundwater salinity monitoring dashboard for researchers and policy makers.">
  <title>WellPulse Atlas</title>
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-theme="dark">
<div id="app" class="app">

  <!-- ACCESS GATE -->
  <section id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="gate-logo"><img src="../brand/gws-sence.webp" alt="GWS-SENCE"></div>
      <h1>WellPulse <span>Atlas</span></h1>
      <p class="muted" data-i18n="gate_sub"></p>
      <form id="gateForm" autocomplete="off">
        <input id="gateKey" type="password" data-i18n-ph="gate_ph" autocomplete="off">
        <button class="btn primary" type="submit" data-i18n="gate_go"></button>
      </form>
      <p class="err" id="gateErr"></p>
      <div class="gate-lang"><button type="button" data-lang="en">English</button><button type="button" data-lang="ar">العربية</button></div>
      <div class="partners gate-partners"><img src="../brand/partners/ihe-delft-wdpp.png" alt="IHE Delft / UNESCO – Water and Development Partnership Programme" title="IHE Delft / UNESCO – Water and Development Partnership Programme"><img src="../brand/partners/heliopolis-university.png" alt="Heliopolis University for Sustainable Development" title="Heliopolis University for Sustainable Development"><img src="../brand/partners/zagazig-university.png" alt="Zagazig University" title="Zagazig University"><img src="../brand/partners/sekem.png" alt="SEKEM" title="SEKEM"><img src="../brand/partners/sekem-development-foundation.png" alt="SEKEM Development Foundation" title="SEKEM Development Foundation"></div>
    </div>
  </section>

  <!-- HEADER -->
  <header class="top" id="top" hidden>
    <div class="brand">
      <svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="url(#g2)"/>
        <path d="M8 27c4-5 8-5 12 0s8 5 12 0 8-5 12 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M8 34c4-5 8-5 12 0s8 5 12 0 8-5 12 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
        <path d="M24 8l5 8-5 9-5-9z" fill="#fff"/>
        <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22b8cf"/><stop offset="1" stop-color="#0b5e6b"/></linearGradient></defs>
      </svg>
      <div><div class="brand-name">WellPulse <span>Atlas</span></div><div class="brand-sub" id="projectName"></div></div>
      <img class="brand-proj" src="../brand/gws-sence-128.webp" alt="GWS-SENCE" title="GWS-SENCE">
    </div>
    <div class="top-actions">
      <div class="updated"><span class="dot" id="liveDot"></span><span id="updatedText"></span></div>
      <button class="ibtn" id="btnRefresh" type="button" data-i18n-title="refresh" title="">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="ibtn" id="btnExport" type="button" data-i18n-title="export" title="">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="ibtn" id="btnPrint" type="button" data-i18n-title="print" title="">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button class="ibtn" id="btnShare" type="button" data-i18n-title="share" title="">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.5 1.5M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="ibtn" id="btnTheme" type="button" data-i18n-title="theme" title="">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A7 7 0 0 1 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <div class="seg" id="langSeg"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ar">ع</button></div>
    </div>
  </header>

  <main id="main" hidden>
    <!-- KPIs -->
    <section class="kpis" id="kpis"></section>

    <!-- FILTERS -->
    <section class="filters">
      <div class="chips" id="classChips">
        <button type="button" class="chip on" data-class="all" data-i18n="all_classes"></button>
        <button type="button" class="chip" data-class="1"><i class="sw c1"></i><span data-i18n="class_low"></span></button>
        <button type="button" class="chip" data-class="2"><i class="sw c2"></i><span data-i18n="class_mod"></span></button>
        <button type="button" class="chip" data-class="3"><i class="sw c3"></i><span data-i18n="class_high"></span></button>
        <button type="button" class="chip" data-class="0"><i class="sw c0"></i><span data-i18n="class_none"></span></button>
      </div>
      <div class="selects">
        <select id="periodSel">
          <option value="30" data-i18n="p30"></option>
          <option value="90" data-i18n="p90"></option>
          <option value="365" data-i18n="p365"></option>
          <option value="0" selected data-i18n="pall"></option>
        </select>
        <select id="farmerSel"></select>
        <input id="search" type="search" data-i18n-ph="search_ph">
      </div>
    </section>

    <!-- MAP + PANEL -->
    <section class="grid">
      <div class="map-wrap">
        <div id="map"></div>
        <div class="map-tools">
          <div class="seg" id="basemapSeg"><button type="button" data-base="sat" class="on" data-i18n="satellite"></button><button type="button" data-base="street" data-i18n="street"></button></div>
          <button class="ibtn" id="btnFit" type="button" data-i18n-title="fit" title="">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="legend">
          <div class="legend-title" data-i18n="legend_title"></div>
          <div><i class="sw c1"></i><span id="lg1"></span></div>
          <div><i class="sw c2"></i><span id="lg2"></span></div>
          <div><i class="sw c3"></i><span id="lg3"></span></div>
          <div><i class="sw c0"></i><span data-i18n="class_none"></span></div>
        </div>
      </div>
      <aside class="panel" id="panel"></aside>
    </section>

    <!-- CHARTS -->
    <section class="charts">
      <div class="card"><div class="card-title" data-i18n="ch_trend"></div><div class="chart" id="chTrend"></div></div>
      <div class="card"><div class="card-title" data-i18n="ch_classes"></div><div class="chart" id="chClasses"></div></div>
      <div class="card"><div class="card-title" data-i18n="ch_monthly"></div><div class="chart" id="chMonthly"></div></div>
      <div class="card"><div class="card-title" data-i18n="ch_scatter"></div><div class="chart" id="chScatter"></div></div>
    </section>

    <!-- TABLE -->
    <section class="card table-card">
      <div class="card-title row"><span data-i18n="latest_readings"></span><span class="muted small" id="tableCount"></span></div>
      <div class="table-scroll"><table id="table"><thead></thead><tbody></tbody></table></div>
    </section>

    <section class="card partners-card"><div class="card-title" data-i18n="partners_title"></div><div class="partners"><img src="../brand/partners/ihe-delft-wdpp.png" alt="IHE Delft / UNESCO – Water and Development Partnership Programme" title="IHE Delft / UNESCO – Water and Development Partnership Programme"><img src="../brand/partners/heliopolis-university.png" alt="Heliopolis University for Sustainable Development" title="Heliopolis University for Sustainable Development"><img src="../brand/partners/zagazig-university.png" alt="Zagazig University" title="Zagazig University"><img src="../brand/partners/sekem.png" alt="SEKEM" title="SEKEM"><img src="../brand/partners/sekem-development-foundation.png" alt="SEKEM Development Foundation" title="SEKEM Development Foundation"></div></section>

    <footer class="foot">
      <span>WellPulse Atlas · GWS-SENCE · <span id="footVersion"></span></span>
      <span id="footGenerated"></span>
      <span class="muted small" data-i18n="foot_note"></span>
    </footer>
  </main>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="../js/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
